# Render blueprint — one-click deploy of the Expensify Docker service.
# Secrets (DATABASE_URL, JWT_SECRET) are marked `sync: false`, so Render prompts
# for them in the dashboard instead of storing them in the repo.
services:
  - type: web
    name: expensify
    runtime: docker
    plan: free
    region: singapore # closest to Neon ap-southeast-1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_UPLOAD_ROWS
        value: "50000"
